workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic   # name you gave when connecting in Step 3

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.relyonsoft.lmspro
      node: 22.17.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Set build number
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/RelyonLMS.xcworkspace" \
            --scheme "RelyonLMS"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - panchalpavan800@gmail.com
        notify:
          success: true
          failure: true

  ios-adhoc:
    name: iOS Ad Hoc (install directly on device)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.relyonsoft.lmspro
      node: 22.17.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/RelyonLMS.xcworkspace" \
            --scheme "RelyonLMS"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - panchalpavan800@gmail.com
        notify:
          success: true
          failure: true
