workflows:
  ios-development:
    name: iOS Development (test on device)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.relyonsoft.lmspro
      node: 22.17.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm install

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/RelyonLMS.xcworkspace" \
            --scheme "RelyonLMS" \
            --config "Debug"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - panchalpavan800@gmail.com
        notify:
          success: true
          failure: true
