workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store      # change to 'ad_hoc' for direct device install
        bundle_identifier: com.relyonsoft.lmspro
      vars:
        XCODE_PROJECT: "ios/RelyonLMS.xcodeproj"
        XCODE_SCHEME: "RelyonLMS"
        BUNDLE_ID: "com.relyonsoft.lmspro"
      node: 22.17.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set build number from Codemagic build number
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  ios-adhoc:
    name: iOS Ad Hoc (direct install on device)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.relyonsoft.lmspro
      vars:
        XCODE_PROJECT: "ios/RelyonLMS.xcodeproj"
        XCODE_SCHEME: "RelyonLMS"
      node: 22.17.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - saralpaypack@gmail.com
        notify:
          success: true
          failure: true
